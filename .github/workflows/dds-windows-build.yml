name: DDS Windows Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dds:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Reconstruct DDS source
        shell: pwsh
        run: |
          $b64 = Get-Content 'dds-ci2/source.tar.xz.b64' -Raw
          [IO.File]::WriteAllBytes('dds-source.tar.xz', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'dds-source.tar.xz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '793db2ace5f19d808498997ed354eb9776b985984528586f23f4e27b57b178ad') {
            throw "DDS source hash mismatch: $hash"
          }
          New-Item -ItemType Directory -Force dds | Out-Null
          tar.exe -xJf dds-source.tar.xz -C dds

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PDFium x64
        shell: pwsh
        run: |
          $url = 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7988/pdfium-win-x64.tgz'
          Invoke-WebRequest -Uri $url -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force pdfium | Out-Null
          tar.exe -xzf pdfium.tgz -C pdfium
          $dll = Get-ChildItem pdfium -Recurse -Filter pdfium.dll -File | Select-Object -First 1
          if (-not $dll) { throw 'pdfium.dll missing from PDFium archive' }
          New-Item -ItemType Directory -Force 'dds/src/Dokkaebi.DocumentStudio.Native/native' | Out-Null
          Copy-Item $dll.FullName 'dds/src/Dokkaebi.DocumentStudio.Native/native/pdfium.dll' -Force

      - name: Restore projects
        shell: pwsh
        working-directory: dds
        run: |
          dotnet restore src/Dokkaebi.DocumentStudio.Native/Dokkaebi.DocumentStudio.Native.csproj
          dotnet restore src/Dokkaebi.DocumentStudio.Native.Tests/Dokkaebi.DocumentStudio.Native.Tests.csproj
          dotnet restore src/Dokkaebi.DocumentStudio.OfficeWorker/Dokkaebi.DocumentStudio.OfficeWorker.csproj

      - name: Build WPF app
        shell: pwsh
        working-directory: dds
        run: dotnet build src/Dokkaebi.DocumentStudio.Native/Dokkaebi.DocumentStudio.Native.csproj -c Release -r win-x64 --no-restore

      - name: Run native pure-code tests
        shell: pwsh
        working-directory: dds
        run: dotnet run --project src/Dokkaebi.DocumentStudio.Native.Tests/Dokkaebi.DocumentStudio.Native.Tests.csproj -c Release

      - name: Publish WPF app
        shell: pwsh
        working-directory: dds
        run: dotnet publish src/Dokkaebi.DocumentStudio.Native/Dokkaebi.DocumentStudio.Native.csproj -c Release -r win-x64 --self-contained true -o artifacts/app

      - name: Publish Office worker
        shell: pwsh
        working-directory: dds
        run: dotnet publish src/Dokkaebi.DocumentStudio.OfficeWorker/Dokkaebi.DocumentStudio.OfficeWorker.csproj -c Release -r win-x64 --self-contained true -o artifacts/worker

      - name: Verify native publish
        shell: pwsh
        working-directory: dds
        run: |
          if (-not (Test-Path 'artifacts/app/DokkaebiDocumentStudio.exe')) { throw 'DDS executable missing after publish' }
          if (-not (Test-Path 'artifacts/app/pdfium.dll')) { throw 'pdfium.dll missing after publish' }
          if (-not (Test-Path 'artifacts/worker/DokkaebiDocumentStudio.OfficeWorker.exe')) { throw 'Office worker missing after publish' }
          & 'artifacts/app/DokkaebiDocumentStudio.exe' --release-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "DDS PDFium smoke test failed: $LASTEXITCODE" }

      - name: Stage portable core
        shell: pwsh
        working-directory: dds
        run: |
          New-Item -ItemType Directory -Force artifacts/portable | Out-Null
          Copy-Item artifacts/app/* artifacts/portable -Recurse -Force
          Copy-Item artifacts/worker/DokkaebiDocumentStudio.OfficeWorker.exe artifacts/portable -Force
          New-Item -ItemType Directory -Force artifacts/portable/settings | Out-Null
          New-Item -ItemType Directory -Force artifacts/portable/themes | Out-Null
          New-Item -ItemType Directory -Force artifacts/portable/engines | Out-Null
          $root = (Resolve-Path artifacts/portable).Path
          Get-ChildItem artifacts/portable -File -Recurse | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $rel
          } | Set-Content artifacts/portable/SHA256SUMS.txt
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/DokkaebiDocumentStudio-portable-win-x64.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DokkaebiDocumentStudio-portable-win-x64
          path: dds/artifacts/DokkaebiDocumentStudio-portable-win-x64.zip
          if-no-files-found: error
